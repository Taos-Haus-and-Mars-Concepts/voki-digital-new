  <style>
    a.nav-link {
      color: white;
    text-shadow:
        -1px -1px 0 black,  /* Top left */
         1px -1px 0 black,  /* Top right */
        -1px  1px 0 black,  /* Bottom left */
         1px  1px 0 black;  /* Bottom right */
      text-decoration: none;
      min-width: 80px;
    }
#brand-style {
    color: white;
    text-shadow:
        -1px -1px 0 black,  /* Top left */
         1px -1px 0 black,  /* Top right */
        -1px  1px 0 black,  /* Bottom left */
         1px  1px 0 black;  /* Bottom right */
}

    a.nav-link.active {
      color: #000;
      font-weight: bold
    }

    #scrollContent {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      height: 100%;
      white-space: nowrap;
    }

    #scrollContent>div {
      display: flex;
      animation: textScrollEffect 12s infinite linear;
    }

    @keyframes textScrollEffect {
      from {
        transform: translateX(0%);
      }

      to {
        transform: translateX(-50%);
      }
    }

    #about:target ~ #unique-navbar-tech {
    color: black;
}

.highlight {
  position: relative;
  color: black !important;
  z-index: 1; /* Ensures the text appears above the pseudo-element */
  text-shadow:
    0.5px 0.5px 0 rgba(192, 192, 192, 0.5),   /* Outer white outline - Right bottom */
    -0.5px -0.5px 0 rgba(192, 192, 192, 0.5), /* Outer white outline - Left top */
    0.5px -0.5px 0 rgba(192, 192, 192, 0.5),  /* Outer white outline - Right top */
    -0.5px 0.5px 0 rgba(192, 192, 192, 0.5),  /* Outer white outline - Left bottom */
    1px 1px 0 #4B0082,       /* Inner purple shadow - Right bottom */
    -1px -1px 0 #4B0082,     /* Inner purple shadow - Left top */
    1px -1px 0 #4B0082,      /* Inner purple shadow - Right top */
    -1px 1px 0 #4B0082;      /* Inner purple shadow - Left bottom */
}
